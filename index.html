<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0f18" />
    <title>Echo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-container" data-state="MENU">
      <div id="hud">
        <div class="hud-group">
          <div class="hud-item">Score <span id="score-val">0</span></div>
          <div class="hud-item">Round <span id="round-val">1</span></div>
        </div>
        <div class="hud-group">
          <div class="hud-item">🪙 <span id="coins-val">0</span></div>
          <div class="hud-item" id="powerup-status">None</div>
        </div>
      </div>

      <canvas id="gameCanvas" width="480" height="800" aria-label="Game arena"></canvas>

      <div id="controls-hint">Drag to move, or use arrows / WASD</div>
      <div id="toast" class="toast hidden" role="status" aria-hidden="true"></div>
      <div id="live" class="sr-only" aria-live="polite"></div>

      <div id="main-menu" class="screen">
        <h1>ECHO</h1>
        <p class="best" id="menu-best">No record yet</p>
        <button type="button" class="btn" id="start-btn">Play</button>
        <button type="button" class="btn btn-secondary" id="shop-btn">Shop</button>
      </div>

      <div id="shop-screen" class="screen hidden">
        <h1>Shop</h1>
        <p class="subtitle">Balance: <span id="wallet-val">0</span> coins</p>
        <div class="panel-box">
          <div class="panel-title">Profile</div>
          <div id="profile-stats"></div>
        </div>
        <div class="panel-box preview-box">
          <div class="panel-title">Echoes</div>
          <canvas id="loadout-preview" width="180" height="168" aria-label="Echo preview of the shop items you are trying on"></canvas>
          <p id="try-on-caption" class="try-caption">Tap an item to preview it on an echo</p>
          <button type="button" class="btn try-buy" id="try-on-buy" hidden>Buy</button>
        </div>
        <div class="panel-box">
          <div class="panel-title">Colors</div>
          <div class="shop-grid" id="color-shop"></div>
        </div>
        <div class="panel-box">
          <div class="panel-title">Hats</div>
          <div class="shop-grid" id="hat-shop"></div>
        </div>
        <div class="panel-box">
          <div class="panel-title">Glasses</div>
          <div class="shop-grid" id="glasses-shop"></div>
        </div>
        <button type="button" class="btn" id="close-shop">Back</button>
      </div>

      <div id="game-over-screen" class="screen hidden">
        <h1>You lost</h1>
        <p class="subtitle" id="final-stats">Round 1 · 0 pts</p>
        <p class="best" id="final-best"></p>
        <button type="button" class="btn" id="retry-btn">Play again</button>
        <button type="button" class="btn btn-secondary" id="menu-btn">Main menu</button>
      </div>
    </div>
    <script type="module" src="/src/game.js"></script>
  </body>
</html>
